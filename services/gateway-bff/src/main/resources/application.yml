spring:
  application:
    name: gateway-bff
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lawflux}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/lawflux/protocol/openid-connect/certs}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:lawflux}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
  grpc:
    client:
      default-channel:
        default-load-balancing-policy: pick_first
      channels:
        identity:
          address: ${IDENTITY_GRPC_ADDRESS:localhost:9091}
          negotiation-type: plaintext
        cases:
          address: ${CASES_GRPC_ADDRESS:localhost:9092}
          negotiation-type: plaintext
        documents:
          address: ${DOCUMENTS_GRPC_ADDRESS:localhost:9093}
          negotiation-type: plaintext
        billing:
          address: ${BILLING_GRPC_ADDRESS:localhost:9094}
          negotiation-type: plaintext
  config:
    import: classpath:lawflux-defaults.yml
server:
  port: ${HTTP_PORT:8080}
  address: ${HTTP_ADDRESS:127.0.0.1}

lawflux:
  scaffold-events-enabled: ${SCAFFOLD_EVENTS_ENABLED:false}
