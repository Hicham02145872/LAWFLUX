spring:
  application:
    name: case-service
  grpc:
    server:
      host: ${GRPC_HOST:127.0.0.1}
      port: ${GRPC_PORT:9092}
      reflection:
        enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lawflux_cases}
    username: ${DB_USER:lawflux_cases}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  config:
    import: classpath:lawflux-defaults.yml
server:
  port: ${HTTP_PORT:8082}
  address: ${HTTP_ADDRESS:127.0.0.1}
lawflux:
  cases:
    access-enabled: ${CASES_ACCESS_ENABLED:true}
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lawflux}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/lawflux/protocol/openid-connect/certs}
