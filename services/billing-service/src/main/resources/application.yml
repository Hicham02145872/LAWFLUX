spring:
  application:
    name: billing-service
  grpc:
    server:
      host: ${GRPC_HOST:127.0.0.1}
      port: ${GRPC_PORT:9094}
      reflection:
        enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lawflux_billing}
    username: ${DB_USER:lawflux_billing}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  config:
    import: classpath:lawflux-defaults.yml
server:
  port: ${HTTP_PORT:8084}
  address: ${HTTP_ADDRESS:127.0.0.1}
